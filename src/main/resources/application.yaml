spring:
  application:
    name: velocity-api
  datasource:
    url: jdbc:postgresql://localhost:5432/velocity
    username: admin
    password: ${POSTGRES_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_updates: true
  liquibase:
    contexts: dev
  data:
    web:
      pageable:
        max-page-size: 50
    redis:
      host: localhost
      port: 6379

security:
  jwt:
    secret-key: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000 # 24h in ms

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
  api-docs:
    path: /api/api-docs

pricing:
  daily-rate: 25.00

server:
  port: 8080