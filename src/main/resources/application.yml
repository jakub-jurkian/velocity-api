spring:
  application:
    name: velocity-api
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_updates: true
        ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 50

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
  api-docs:
    path: /api/api-docs

pricing:
  daily-rate: 25.00

server:
  port: 8080