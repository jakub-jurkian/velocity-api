spring:
  application:
    name: velocity-api
  profiles:
    default: dev
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    properties:
      hibernate:
        order_updates: true
        ddl-auto: validate
        jdbc:
          batch_size: 50
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 50
    redis:
      repositories:
        enabled: false
  web:
    locale: en

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
  api-docs:
    path: /api/api-docs

pricing:
  daily-rate: 25.00

server:
  port: 8080