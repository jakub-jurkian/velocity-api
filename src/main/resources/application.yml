spring:
  application:
    name: velocity-api
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        order_updates: true
        jdbc:
          batch_size: 50
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 50
    redis:
      timeout: 200ms
      connect-timeout: 200ms
      repositories:
        enabled: false

  web:
    locale: en

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
  api-docs:
    path: /api/api-docs

pricing:
  daily-rate: 25.00

server:
  port: 8080

management:
  health:
    # Redis only backs token revocation, which fails open by design (see TokenBlacklistRepository).
    # A Redis outage must not mark the whole API as down.
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never