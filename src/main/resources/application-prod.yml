spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
  liquibase:
    contexts: prod
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

security:
  jwt:
    secret-key: ${JWT_SECRET}
    expiration-ms: 86400000 # 24h in ms

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}