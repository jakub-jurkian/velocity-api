services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=velocity
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    container_name: velocity-redis
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: