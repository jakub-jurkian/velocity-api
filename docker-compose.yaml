services:
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      # SB will automatically map these to properties in application-prod.yml
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-velocity}
      - DATABASE_USER=${POSTGRES_USER:-admin}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # ":?" makes Compose refuse to start rather than fall back to something guessable.
      # Values come from .env locally (gitignored) and from the host environment in deployment.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env - see .env.example}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-velocity}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    container_name: velocity-redis
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: